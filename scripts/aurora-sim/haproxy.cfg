# capstan aurora-sim — the HAProxy "cluster endpoint".
#
# One frontend (the endpoint every capstan pipeline connects to) over a two-node
# backend: the writer is serving, the promotable node starts disabled. A failover is
# the runtime-API flip the test module drives over the admin socket (port 9999):
#
#   set server writer_nodes/promotable state ready
#   set server writer_nodes/writer      state maint
#
# ...which is the wire-level equivalent of an Aurora failover's DNS change: the
# endpoint's target changes and every open connection through it is dropped.
global
    stats socket *:9999 level admin

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 120s
    timeout server 120s

frontend writer_endpoint
    bind *:3306
    default_backend writer_nodes

backend writer_nodes
    option mysql-check user haproxy_check
    server writer writer:3306 check inter 1s
    server promotable promotable:3306 check inter 1s disabled
