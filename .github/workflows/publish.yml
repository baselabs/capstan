name: Publish to Hex.pm

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full SHA of the landed release commit
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  upload:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # no green run yet
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      qualification-run: ${{ steps.hex.outputs.qualification-run }}
      qualification-sha256: ${{ steps.hex.outputs.qualification-sha256 }}
    steps:
      - name: Admit the default ref and full release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the release commit's declared runtime
        id: runtime
        run: |
          git show HEAD:.tool-versions | python3 -I -c '
          import os, re, sys
          versions = {}
          for line in sys.stdin.read().splitlines():
              fields = line.split("#", 1)[0].split()
              if fields:
                  if len(fields) < 2 or fields[0] in versions:
                      raise SystemExit("::error::Invalid or duplicate runtime declaration")
                  versions[fields[0]] = fields[1]
          elixir, otp = versions.get("elixir", ""), versions.get("erlang", "")
          match = re.fullmatch(r"(\d+\.\d+\.\d+)-otp-(\d+)", elixir)
          if not match or not re.fullmatch(r"\d+\.\d+\.\d+(?:\.\d+)*", otp) or match[2] != otp.split(".")[0]:
              raise SystemExit("::error::Declare exact Elixir and OTP versions in .tool-versions")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"elixir={elixir}\notp={otp}\n")
          '
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.runtime.outputs.elixir }}
          otp-version: ${{ steps.runtime.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false
      - name: Install the shared action's Hex client outside Mix source
        working-directory: ${{ runner.temp }}
        run: |
          test ! -e mix.exs
          hex_version="$(curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force
      - uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        id: hex
        with:
          operation: upload
          package: capstan
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          organization-read-key: ${{ secrets.HEX_ORG_KEY_PUBLISH_API_READ }}

  read-back:
    needs: upload
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # no green run yet
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.hex.outputs.commit }}
    steps:
      - name: Admit the default ref and full release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the release commit's declared runtime
        id: runtime
        run: |
          git show HEAD:.tool-versions | python3 -I -c '
          import os, re, sys
          versions = {}
          for line in sys.stdin.read().splitlines():
              fields = line.split("#", 1)[0].split()
              if fields:
                  if len(fields) < 2 or fields[0] in versions:
                      raise SystemExit("::error::Invalid or duplicate runtime declaration")
                  versions[fields[0]] = fields[1]
          elixir, otp = versions.get("elixir", ""), versions.get("erlang", "")
          match = re.fullmatch(r"(\d+\.\d+\.\d+)-otp-(\d+)", elixir)
          if not match or not re.fullmatch(r"\d+\.\d+\.\d+(?:\.\d+)*", otp) or match[2] != otp.split(".")[0]:
              raise SystemExit("::error::Declare exact Elixir and OTP versions in .tool-versions")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"elixir={elixir}\notp={otp}\n")
          '
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.runtime.outputs.elixir }}
          otp-version: ${{ steps.runtime.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false
      - name: Install the shared action's Hex client outside Mix source
        working-directory: ${{ runner.temp }}
        run: |
          test ! -e mix.exs
          hex_version="$(curl --fail --silent --show-error --max-time 30 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force
      - uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        id: hex
        with:
          operation: read-back
          package: capstan
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.upload.outputs.qualification-run }}
          qualification-sha256: ${{ needs.upload.outputs.qualification-sha256 }}
          release-assets-directory: ${{ runner.temp }}/release-assets
      - name: Retain the verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
