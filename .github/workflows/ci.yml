name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 8.0 keeps mysql_native_password (root planting account); capstan_sha2 is caching_sha2.
          - mysql: "8.0"
            image: "mysql:8.0"
            native_flag: "--default-authentication-plugin=mysql_native_password"
          # 8.4 disables built-in mysql_native_password by default (removed outright in 9.x), so the
          # pipeline account exercises the caching_sha2 default posture (design Q6). The plugin is
          # re-enabled only for the root PLANTING account the test harness authenticates as.
          - mysql: "8.4"
            image: "mysql:8.4"
            native_flag: "--mysql-native-password=ON"
    env:
      MIX_ENV: test
      # Throwaway credentials for a disposable CI container — never a real secret (mirrors
      # scripts/dev-substrate.sh). No port is hard-coded anywhere: MYSQL_PORT_80 is bound by the
      # container below AND read by the Elixir suite (Dotenvy in config/runtime.exs → shared_port/0),
      # so CI and the tests always agree on one value.
      MYSQL_PORT_80: "11619"
      ROOT_PW: probe
      SHA2_USER: capstan_sha2
      SHA2_PW: capstan_sha2_pw

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # DOCKER MANDATE (routed from Task 18). The :integration marquees stream from the shared
      # substrate started below, and the :requires_docker marquees spin their own THROWAWAY
      # mysql:8.0 containers — both need a working daemon. Absent Docker they'd surface later and
      # noisier (`with_throwaway_mysql` raises; the substrate never comes up); fail loudly here
      # first with the clearest message.
      - name: Require Docker
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker daemon unavailable — the integration marquees cannot run."; exit 1; }
          docker --version

      # Start MySQL now (non-blocking) so it initialises while BEAM/deps set up. The five Q5
      # precondition variables + enforce-gtid-consistency mirror scripts/dev-substrate.sh COMMON_FLAGS.
      # capstan_sha2 (with LOCK TABLES) is seeded at init by the SAME scripts/mysql-init/ mount
      # docker-compose.yml uses — one definition of the replication user, so CI cannot drift from local.
      - name: Start MySQL ${{ matrix.mysql }} substrate
        run: |
          docker run -d --name mysql-cdc-probe \
            -p "127.0.0.1:${MYSQL_PORT_80}:3306" \
            -e "MYSQL_ROOT_PASSWORD=${ROOT_PW}" \
            -e MYSQL_DATABASE=probe_db \
            -e "CAPSTAN_SHA2_USER=${SHA2_USER}" \
            -e "CAPSTAN_SHA2_PASSWORD=${SHA2_PW}" \
            -v "${PWD}/scripts/mysql-init:/docker-entrypoint-initdb.d:ro" \
            "${{ matrix.image }}" \
            --binlog-format=ROW \
            --binlog-row-image=FULL \
            --binlog-row-metadata=FULL \
            --binlog-row-value-options= \
            --gtid-mode=ON \
            --enforce-gtid-consistency=ON \
            --server-id=1 \
            ${{ matrix.native_flag }}

      - name: Set up BEAM (Erlang/OTP + Elixir)
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.mysql }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.mysql }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      # Wait for the REAL networked server (the official image runs a socket-only init server first;
      # a TCP probe forced via -h127.0.0.1 answers only on the network-bound server). capstan_sha2 is
      # already seeded by the scripts/mysql-init/ mount; here we only re-point ROOT to native auth.
      # --get-server-public-key lets a caching_sha2 root (8.4's default) complete auth over the probe.
      - name: Wait for MySQL and re-point root auth
        run: |
          for _ in $(seq 1 60); do
            if docker exec mysql-cdc-probe mysql -h127.0.0.1 -P3306 --get-server-public-key \
                 -uroot -p"${ROOT_PW}" -N -e 'SELECT 1' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          [ "${ready:-0}" = "1" ] || { echo "::error::MySQL never became ready"; docker logs mysql-cdc-probe; exit 1; }
          # On 8.4 root defaults to caching_sha2; the harness plants DDL/DML as native-password root
          # (mysql_case.ex query_connection/1), so re-point root to the (re-enabled) native plugin.
          # Harmless on 8.0 (already native). capstan_sha2 + its LOCK TABLES grant come from the init.
          docker exec mysql-cdc-probe mysql -h127.0.0.1 --get-server-public-key -uroot -p"${ROOT_PW}" -e "
            ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY '${ROOT_PW}';
            FLUSH PRIVILEGES;"

      - name: Unit tests
        run: mix test

      - name: Live-substrate tests
        run: mix test --only live

      # Shared-substrate integration marquees. `mix test --only <tag>` EXITS NON-ZERO when the tag
      # matches zero tests, so a mis-tag that would silently drop a marquee fails CI on its own —
      # no stdout `[SKIP]` grep needed. The docker-gated marquees are a separate tag (next step).
      - name: Integration marquees (shared substrate)
        run: mix test --only integration

      # Docker-gated marquees (the two gap-purge, compression, PARTIAL_JSON), tagged
      # `:requires_docker`. An absent-Docker run EXCLUDES them through ExUnit (a genuine skip in the
      # summary, never a spurious pass); CI HAS Docker, so they must RUN here. If Docker were
      # unavailable, `with_throwaway_mysql/2` raises and this step fails — a silently-untested run
      # can never go green.
      - name: Docker-gated marquees (throwaway containers)
        run: mix test --only requires_docker

      # Enforces mix.exs's coverage threshold (Mix default 90) over the FULL exercised
      # surface — every tag, against the live substrate — with the test-support harness
      # excluded from the denominator (see test_coverage in mix.exs). A drop below the
      # threshold fails CI here, so the number stays honest.
      - name: Coverage (threshold-enforced, all tags)
        run: mix test --cover --include integration --include live --include requires_docker

      - name: Dialyzer
        run: mix dialyzer

      - name: Stop MySQL substrate
        if: always()
        run: docker rm -f mysql-cdc-probe || true

  # The REFERENCE EXAMPLE (examples/replication_pipeline): a docker stack
  # (source MySQL → capstan release container → destination MySQL) that is the
  # public sink API's canary — if capstan breaks its consumer surface, this
  # end-to-end run goes red. It drives the exact README sequence: first
  # delivery (mirror + value-free receipts + durable checkpoint), pipeline
  # restart, resume with no duplicate re-delivery.
  reference-example:
    name: Reference example (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/replication_pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the pipeline's first-boot checkpoint seed
        run: |
          for _ in $(seq 1 60); do
            if docker compose exec -T dest-mysql mysql -pprobe example_dst -N -B \
                 -e "SELECT gtid_set FROM capstan_checkpoint" 2>/dev/null | grep -q .; then
              ready=1; break
            fi
            sleep 5
          done
          [ "${ready:-0}" = "1" ] || { echo "::error::pipeline never seeded its checkpoint"; docker compose logs pipeline; exit 1; }

      - name: First delivery — mirror + value-free receipts + checkpoint
        run: |
          docker compose exec -T source-mysql mysql -pprobe example_src \
            -e "INSERT INTO orders (id, note) VALUES (1, 'hello'), (2, 'world')"
          for _ in $(seq 1 30); do
            n=$(docker compose exec -T dest-mysql mysql -pprobe example_dst -N -B \
                 -e "SELECT COUNT(*) FROM orders" 2>/dev/null)
            [ "$n" = "2" ] && break
            sleep 2
          done
          [ "$n" = "2" ] || { echo "::error::mirror never materialized the rows"; docker compose logs pipeline; exit 1; }
          # The receipts carry structure only — a value column must not exist.
          docker compose exec -T dest-mysql mysql -pprobe example_dst -N -B \
            -e "SELECT txn_gtid, schema_name, table_name, op FROM cdc_receipts WHERE table_name = 'orders'" \
            | grep -c "insert" | grep -qx "2"

      - name: Restart resume — no duplicate re-delivery
        run: |
          docker compose restart pipeline
          docker compose exec -T source-mysql mysql -pprobe example_src \
            -e "INSERT INTO orders (id, note) VALUES (3, 'after restart')"
          for _ in $(seq 1 30); do
            n=$(docker compose exec -T dest-mysql mysql -pprobe example_dst -N -B \
                 -e "SELECT COUNT(*) FROM orders" 2>/dev/null)
            [ "$n" = "3" ] && break
            sleep 2
          done
          [ "$n" = "3" ] || { echo "::error::post-restart row never arrived"; docker compose logs pipeline; exit 1; }
          # Resume from the durable checkpoint: ids 1..2 are NOT re-delivered.
          r=$(docker compose exec -T dest-mysql mysql -pprobe example_dst -N -B \
               -e "SELECT COUNT(*) FROM cdc_receipts WHERE table_name = 'orders'")
          [ "$r" = "3" ] || { echo "::error::expected exactly 3 receipts, got $r"; docker compose logs pipeline; exit 1; }
          docker compose exec -T dest-mysql mysql -pprobe example_dst -N -B \
            -e "SELECT gtid_set FROM capstan_checkpoint" | grep -q .

      - name: Teardown
        if: always()
        run: docker compose down -v

  # The DECLARED floor (mix.exs `elixir: "~> 1.15"`) — the main matrix pins 1.19, so without
  # this leg the floor claim is never tested anywhere. Compile (warnings-as-errors, proving
  # e.g. the pin-operator `size(^var)` form is floor-valid) + the full unit suite (real-byte
  # conformance fixtures included; the unit tag excludes the substrate marquees by default).
  # Every test-env dependency floors at <= 1.13 (credo >= 1.13, dialyxir >= 1.6, dotenvy ~>
  # 1.13, decimal ~> 1.12, jason ~> 1.4), so the whole env resolves on 1.15.
  floor:
    name: Elixir floor (1.15)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up BEAM (Erlang/OTP + Elixir)
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.15.8"

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-floor-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-floor-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Unit tests
        run: mix test
